name: Build

on:
  push:
  pull_request:

jobs:
  build_all:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ffmpeg
        run: sudo apt update && sudo apt install -y ffmpeg

      - name: Build and test examples
        run: |
          pip install matplotlib
          ./scripts/test_examples.sh
